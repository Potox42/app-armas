name: Probar rama (sin publicar)

on:
  push:
    branches-ignore: [main, prueba-web]

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    env:
      BASE_URL: /app-armas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
        continue-on-error: true
      - run: npx expo export --platform web
      - run: node scripts/web-app.js
      # La versión compilada se deja en la rama prueba-web solo para probarla; no se publica.
      - run: |
          cd dist
          git init -q -b prueba-web
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Compilación de prueba de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" prueba-web
