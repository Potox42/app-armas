name: Comprobar cambios

# Revisa cada propuesta de cambio (pull request) sin publicar nada.
on:
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    env:
      BASE_URL: /app-armas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Revisar el código (lint)
        run: |
          set -o pipefail
          npx expo lint -- -f unix | tee lint.txt || { grep -E '^[^:]+:[0-9]+:[0-9]+:' lint.txt | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2::\4/'; exit 1; }
      - run: npx expo export --platform web
      - run: php -l servidor/t360-licencias/t360-licencias.php
