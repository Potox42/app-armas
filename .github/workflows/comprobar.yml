name: Comprobar cambios

# Revisa cada propuesta de cambio (pull request) sin publicar nada.
on:
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    env:
      BASE_URL: /app-armas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Revisar el código (lint)
        run: |
          npx expo lint > lint.txt 2>&1 && exit 0
          head -60 lint.txt | sed 's/^/::warning::/'
          exit 1
      - run: npx expo export --platform web
      - run: php -l servidor/t360-licencias/t360-licencias.php
